name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: dotnet publish src/CS2Presence/CS2Presence.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: CS2Presence-win-x64
          path: dist/CS2Presence.exe

      - name: Create GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CS2Presence.exe
          generate_release_notes: true
